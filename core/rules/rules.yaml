# GOAA 规则 · 机可校验实例（YAML·编程语义）
# 权威：rules/classification.md（规则层·人语义）；本文件为其数据化实例（编程语义），由 tools/validator.py 校验
# 对应：rules/validation.md（规则生效闸门：写出≠生效）；docs/concepts/三语义-人机编程.md
# 修改：以 rules/ 为唯一数据源，本文件=编程语义投影；修改须同步 classification.md 并留痕
# 版本：唯一版本 1.0

schema_version: "1.0"

体系:
  name: GOAA
  full_name: Governance-Oriented Agent Architecture (GOAA 2.0)
  一句话: 不解决"怎么让 AI 干活"，解决"怎么让 AI 干得可控"

# 🔴 编号≠优先级：L0-L4 编号=稳定性/修改门槛分级；效力优先级见下方 priority 链（与 IDENTITY 基本法第零条一致）
规则分级:
  - id: L0
    name: 宪法级
    说明: 不可突破的元规则（母公理/存亡级/运转级）·修改须修宪程序
    修改门槛: 最高决断者明令
  - id: L1
    name: 身份级
    说明: 系统三文件（SOUL/IDENTITY/USER）与身份档案
    修改门槛: 主人审核+三检
  - id: L2
    name: 规则级
    说明: 规则（写什么）：五级分类/规则生效闸门/编程语义实例
    修改门槛: 主人审核+三检
  - id: L3
    name: 机制级
    说明: 机制（怎么验）：启动/收摊/激活/立项/歧义/复用/动态率/记忆装载
    修改门槛: 主人审核+三检
  - id: L4
    name: 任务/参考级
    说明: 具体指令（临时）/参考资料（docs/、examples/）
    修改门槛: 上级指令/自由

核心规则:
  - id: R001
    级别: L0
    name: 人100%决断权
    人语义: 人与AI协作时，人保有100%决断权；AI仅有执行权与建议权
    校验: MANUAL        # 人工·裁决留痕（记录层强制）
    校验时机: 每次裁决节点
    留痕位置: 对话记录/灵魂备份
    状态: 已生效
    执行机制: [歧义治理, 立项判定]
  - id: R002
    级别: L0
    name: 系统文件不可修改
    人语义: 宪法层/规则层/机制层/系统三文件不可由机修改；修改须主人指令并留痕
    校验: VALIDATOR    # 目录只读检测（validator 硬拦截）
    校验时机: 写入前置/CI 校验
    留痕位置: 变更记录
    状态: 已生效
    执行机制: [validator.py]
  - id: R003
    级别: L0
    name: 记忆不可删除
    人语义: 史书层（灵魂备份/对话记录/日志）只追加，永不删改
    校验: VALIDATOR    # 只追加检测（哈希/条数校验）
    校验时机: 写入时/定期校验
    留痕位置: 文件哈希
    状态: 已生效
    执行机制: [记忆装载规则, validator.py]
  - id: R004
    级别: L1
    name: 权限三级分级
    人语义: L1全自动/L2先做后报/L3审批前置；授权以 USER.md 为唯一源
    校验: MANUAL        # 人工配置·Agent_Profile 不得超出
    校验时机: 部署/授权变更时
    留痕位置: USER.md 变更记录
    状态: 已生效
    执行机制: [onboarding]
  - id: R005
    级别: L2
    name: 写出≠生效
    人语义: 规则写入不自动生效，须过规则生效闸门（validation.md）校验
    校验: VALIDATOR    # 规则存在性/格式/引用校验
    校验时机: 规则变更时/CI 校验
    留痕位置: 规则状态字段
    状态: 已生效
    执行机制: [validation.md, validator.py]
  - id: R006
    级别: L3
    name: 真问题闸门
    人语义: 任务先过立项判定（problem-gate）：假问题不立项=不消耗资源
    校验: MANUAL        # 人裁（真问题三关：有前提/非两难/真求辨）
    校验时机: 每次立项时
    留痕位置: 立项记录
    状态: 已生效
    执行机制: [problem-gate]
  - id: R007
    级别: L3
    name: 歧义判定权在人
    人语义: 机只显影"这里可能有歧义"，判定归人（歧义治理机制）
    校验: MANUAL
    校验时机: 歧义出现时
    留痕位置: 歧义处理记录
    状态: 已生效
    执行机制: [ambiguity-governance]
  - id: R008
    级别: L3
    name: 记忆分级装载
    人语义: 启动加载/运行召回/阈值控制/归档衰减（memory-loading 机制）
    校验: VALIDATOR    # 蒸馏存在性/备份存在性
    校验时机: 启动/收摊时
    留痕位置: 启动报告
    状态: 已生效
    执行机制: [memory-loading, startup, shutdown]
  - id: R009
    级别: L2
    name: 单一数据源
    人语义: 权限以 USER 为唯一源、定论以 rules 为唯一源；引用处只同步
    校验: MANUAL        # 漂移检测（人工/定期）
    校验时机: 定期/发现冲突时
    留痕位置: 冲突处理记录
    状态: 已生效
    执行机制: [validation.md]

deprecated_rules: []   # 失效规则保留区：{id, name, 失效原因, 替代规则}——不删改，全链路留痕

# 🔴 效力优先级链（与 IDENTITY 基本法第零条一致；编号≠优先级）
优先级:
  chain: [L0宪法级, L2规则级, L3机制级, L1身份级]
  说明: 身份层虽编号 L1，但效力优先级低于规则级/机制级——编号=稳定性分级，优先级=效力层级，两维度分离
  冲突处理: 下位服从上位；无法判定时交主人裁决，不得自行取舍

单一数据源:
  权限: identity/USER.md
  规则定论: rules/
  修改规则: 改唯一源，引用处只同步，禁止只改引用

validator_对应（开源通用版实际能力·2026-08-26 校准·声明=实现）:
  - 校验项: 核心目录/文件存在性（硬检·FAIL 级）
    覆盖: R002 R005 R008
    说明: tools/validator.py 执行（目录 6 项 + 文件 16 项）
  - 校验项: 语义同步检查（关键词·WARN 级）
    覆盖: R005
    说明: 基本法/设计原理关键概念（决断权/公理/文件）对照
  - 校验项: YAML Schema 合规（必填节/规则 id 唯一性）
    覆盖: 本文件自身
    说明: rules.yaml 结构硬检
  - 校验项: 死链/引用检查（[Rxxx] 标准格式·FAIL 级）
    覆盖: R005 R009
    说明: 规则引用须在 rules.yaml 已定义
  - 校验项: 只追加检测（史书层哈希基线·--memory 模式）
    覆盖: R003
    说明: 对话记录/日志/灵魂备份哈希基线比对，防已落盘史书被改
  - 未覆盖项（人工/部署侧）: 目录只读权限强制（R002 依赖文件系统权限配置）· 规则语义深度校验（内部定制能力·不开源）
