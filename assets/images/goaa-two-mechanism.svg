<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="auto" role="img" aria-label="GOAA 两仪机制架构图：生成端、检验端、裁决端">
  <!-- GOAA 两仪机制：只图示 README 已公开内容（生成端 ↔ 检验端 → 裁决端） -->
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3b4252"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3b4252"/>
    </marker>
  </defs>

  <!-- 生成端 -->
  <rect x="20" y="60" width="180" height="96" rx="10" fill="#f4f6f8" stroke="#3b4252" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b4252" font-family="sans-serif">生成端</text>
  <text x="110" y="120" text-anchor="middle" font-size="13" fill="#5c6470" font-family="sans-serif">AI 生产</text>
  <text x="110" y="142" text-anchor="middle" font-size="11.5" fill="#8a919c" font-family="sans-serif">在规则约束下执行</text>

  <!-- 检验端 -->
  <rect x="250" y="60" width="180" height="96" rx="10" fill="#f4f6f8" stroke="#3b4252" stroke-width="2"/>
  <text x="340" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b4252" font-family="sans-serif">检验端</text>
  <text x="340" y="120" text-anchor="middle" font-size="13" fill="#5c6470" font-family="sans-serif">规则 / 校验</text>
  <text x="340" y="142" text-anchor="middle" font-size="11.5" fill="#8a919c" font-family="sans-serif">只检不判</text>

  <!-- 裁决端 -->
  <rect x="480" y="60" width="180" height="96" rx="10" fill="#f4f6f8" stroke="#3b4252" stroke-width="2"/>
  <text x="570" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b4252" font-family="sans-serif">裁决端</text>
  <text x="570" y="120" text-anchor="middle" font-size="13" fill="#5c6470" font-family="sans-serif">人（最终决断者）</text>
  <text x="570" y="142" text-anchor="middle" font-size="11.5" fill="#8a919c" font-family="sans-serif">歧义·争议·定稿归人</text>

  <!-- 双向箭头：生成端 ↔ 检验端 -->
  <line x1="200" y1="95" x2="250" y2="95" stroke="#3b4252" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <line x1="250" y1="121" x2="200" y2="121" stroke="#3b4252" stroke-width="2.5" marker-end="url(#arrowL)"/>
  <text x="225" y="84" text-anchor="middle" font-size="11" fill="#5c6470" font-family="sans-serif">生产</text>
  <text x="225" y="136" text-anchor="middle" font-size="11" fill="#5c6470" font-family="sans-serif">检查</text>

  <!-- 箭头：检验端 → 裁决端 -->
  <line x1="430" y1="108" x2="480" y2="108" stroke="#3b4252" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="455" y="98" text-anchor="middle" font-size="11" fill="#5c6470" font-family="sans-serif">检出</text>

  <!-- 核心语义 -->
  <rect x="20" y="196" width="640" height="76" rx="8" fill="#eef2f7" stroke="#3b4252" stroke-width="1.5"/>
  <text x="340" y="222" text-anchor="middle" font-size="13.5" fill="#3b4252" font-family="sans-serif">核心语义：不是「AI 说了算」，也不是「人包办一切」</text>
  <text x="340" y="244" text-anchor="middle" font-size="13" fill="#5c6470" font-family="sans-serif">人机共同向公知（客观规律与公开事实）负责——谁的主张符合事实，谁就对</text>
  <text x="340" y="264" text-anchor="middle" font-size="11.5" fill="#8a919c" font-family="sans-serif">规则权威性来自「可校验」，而非「AI 的自觉」</text>
</svg>
