# GOAA Rules · Machine-verifiable instance (YAML · programming semantics)
# Authority: rules/classification.md (rule layer · human semantics); this file is its data instance (programming semantics), validated by tools/validator.py
# Corresponds to: rules/validation.md (rule effect gate: written ≠ effective); docs/concepts/three-semantics.md
# Modification: rules/ is the single data source, this file is the programming-semantics projection; changes must be synced to classification.md with trace
# Version: single version 1.0
# NOTE (pending external review): structure/keys mirror the zh original for validator-schema compatibility; key naming policy under review

schema_version: "1.0"

体系:
  name: GOAA
  full_name: Governance-Oriented Agent Architecture (GOAA 2.0)
  一句话: It solves not "how to make AI work" but "how to make AI reliably governable"

# 🔴 Number ≠ priority: L0-L4 numbering = stability/modification-gate tiering; effective priority follows the priority chain below (consistent with the Basic Law Article Zero)
规则分级:
  - id: L0
    name: 宪法级
    说明: Unbreakable meta-rules (mother axioms / survival-level / operational-level) · change requires constitutional procedure
    修改门槛: Explicit order of the highest decision-maker
  - id: L1
    name: 身份级
    说明: The three system files (SOUL/IDENTITY/USER) and identity archives
    修改门槛: Owner review + three checks
  - id: L2
    name: 规则级
    说明: Rules (what is written): five-tier classification / rule effect gate / programming-semantics instances
    修改门槛: Owner review + three checks
  - id: L3
    name: 机制级
    说明: Mechanisms (how to verify): startup / wrap-up / onboarding / project approval / ambiguity / reuse / dynamic rates / memory loading
    修改门槛: Owner review + three checks
  - id: L4
    name: 任务/参考级
    说明: Specific instructions (temporary) / reference materials (docs/, examples/)
    修改门槛: Superior instruction / free

核心规则:
  - id: R001
    级别: L0
    name: 人100%决断权
    人语义: In human-AI collaboration, humans retain 100% decision rights; AI holds only execution and recommendation rights
    校验: MANUAL        # human adjudication · decision trace (record-layer enforced)
    校验时机: At every decision node
    留痕位置: Conversation records / soul backup
    状态: 已生效
    执行机制: [歧义治理, 立项判定]
  - id: R002
    级别: L0
    name: 系统文件不可修改
    人语义: Constitutional/rule/mechanism layers and the three system files cannot be modified by the machine; changes require owner instruction with trace
    校验: VALIDATOR    # read-only directory detection (validator hard block)
    校验时机: Pre-write / CI check
    留痕位置: Change records
    状态: 已生效
    执行机制: [validator.py]
  - id: R003
    级别: L0
    name: 记忆不可删除
    人语义: Chronicle layer (soul backups / conversation records / logs) is append-only, never modified or deleted
    校验: VALIDATOR    # append-only detection (hash/count checks)
    校验时机: On write / periodic checks
    留痕位置: File hashes
    状态: 已生效
    执行机制: [记忆装载规则, validator.py]
  - id: R004
    级别: L1
    name: 权限三级分级
    人语义: L1 fully automatic / L2 act-then-report / L3 approval-first; authorization uses USER.md as the only source
    校验: MANUAL        # human configuration · Agent_Profile must not exceed
    校验时机: At deployment / authorization changes
    留痕位置: USER.md change records
    状态: 已生效
    执行机制: [onboarding]
  - id: R005
    级别: L2
    name: 写出≠生效
    人语义: Writing a rule does not make it effective; it must pass the rule effect gate (validation.md)
    校验: VALIDATOR    # rule existence/format/reference checks
    校验时机: On rule changes / CI check
    留痕位置: Rule status fields
    状态: 已生效
    执行机制: [validation.md, validator.py]
  - id: R006
    级别: L3
    name: 真问题闸门
    人语义: Tasks first pass project approval (problem-gate): non-genuine problems are not approved = no resource consumption
    校验: MANUAL        # human adjudication (three genuine-problem gates: has premise / not a dilemma / truly seeks resolution)
    校验时机: At every approval
    留痕位置: Approval records
    状态: 已生效
    执行机制: [problem-gate]
  - id: R007
    级别: L3
    name: 歧义判定权在人
    人语义: The machine only surfaces "ambiguity may exist here"; judgment belongs to the human (ambiguity governance)
    校验: MANUAL
    校验时机: When ambiguity appears
    留痕位置: Ambiguity-handling records
    状态: 已生效
    执行机制: [ambiguity-governance]
  - id: R008
    级别: L3
    name: 记忆分级装载
    人语义: Startup loading / runtime recall / threshold control / archive decay (memory-loading mechanism)
    校验: VALIDATOR    # distillation existence / backup existence
    校验时机: At startup / wrap-up
    留痕位置: Startup report
    状态: 已生效
    执行机制: [memory-loading, startup, shutdown]
  - id: R009
    级别: L2
    name: 单一数据源
    人语义: Permissions use USER as the only source, conclusions use rules as the only source; referencing sites only sync
    校验: MANUAL        # drift detection (human / periodic)
    校验时机: Periodic / when conflicts are found
    留痕位置: Conflict-handling records
    状态: 已生效
    执行机制: [validation.md]

deprecated_rules: []   # deprecated-rule retention area: {id, name, reason, replacement} — never delete/modify, full-chain trace

# 🔴 Effective priority chain (consistent with Basic Law Article Zero; number ≠ priority)
优先级:
  chain: [L0宪法级, L2规则级, L3机制级, L1身份级]
  说明: Identity layer is numbered L1 but ranks below rule/mechanism layers in effect — number = stability tier, priority = effect hierarchy; the two dimensions are separate
  冲突处理: Lower tiers defer to higher; if undeterminable, submit to the owner for adjudication, never self-resolve

单一数据源:
  权限: identity/USER.md
  规则定论: rules/
  修改规则: Change the single source; referencing sites only sync; never change only the references

validator_对应 (open-source generic version actual capabilities · 2026-08-26 calibrated · declaration = implementation):
  - 校验项: Core directory/file existence (hard check · FAIL level)
    覆盖: R002 R005 R008
    说明: tools/validator.py executes (6 directories + 16 files)
  - 校验项: Semantic sync check (keywords · WARN level)
    覆盖: R005
    说明: Cross-checks key concepts of the Basic Law / Design Principles (decision rights / axioms / files)
  - 校验项: YAML Schema compliance (required sections / rule id uniqueness)
    覆盖: this file itself
    说明: rules.yaml structure hard check
  - 校验项: Dead-link/reference check ([Rxxx] standard format · FAIL level)
    覆盖: R005 R009
    说明: Rule references must be defined in rules.yaml
  - 校验项: Append-only detection (chronicle hash baseline · --memory mode)
    覆盖: R003
    说明: Hash-baseline comparison of conversation records/logs/soul backups, guarding against post-hoc edits to chronicle files
  - 未覆盖项 (human/deployment side): read-only directory permission enforcement (R002 relies on filesystem permission config) · deep semantic rule validation (internal custom capability · not open-sourced)
