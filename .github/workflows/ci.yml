name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    name: 自检（verify-ownership + validator）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 所有权验证（Lite 发行版核心·verify-ownership.py）
        run: python tools/verify-ownership.py

      - name: 一致性校验（Personal/Core 文档标准区·validator.py）
        run: python tools/validator.py
