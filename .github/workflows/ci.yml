name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    name: 三版自检（verify-ownership + validator）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lite · 所有权验证（verify-ownership.py）
        working-directory: lite
        run: python tools/verify-ownership.py

      - name: Personal · validator
        working-directory: personal
        run: python tools/validator.py

      - name: Core · validator
        working-directory: core
        run: python tools/validator.py
